name: Strong Buy Top100 자동 갱신

on:
  schedule:
    - cron: "0 22 * * 0-4"   # 한국시간 월~금 오전 7시 (미국장 마감 후)
  workflow_dispatch: {}       # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install yfinance pandas openpyxl lxml requests

      - name: 데이터 수집
        run: python update.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/targets.json docs/strong_buy_top100.xlsx
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d) 갱신"
          git push
